<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ページが見つかりません｜モンゴル現地旅行社アルタンツアー</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#2F5D46">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700;900&family=Noto+Sans+JP:wght@400;700&display=swap">
<style>
  :root{
    --ink:#1B2421; --green:#2F5D46; --green-d:#1F4031; --green-l:#4A7C61;
    --cream:#FBFBF8; --sand:#F3EEE3; --line:#E0DACB; --muted:#5C6660; --gold:#F3BD09;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; flex-direction:column;
    background:var(--cream); color:var(--ink);
    font-family:'Noto Sans JP',sans-serif; line-height:1.9; font-size:16px;
  }
  a{color:var(--green)}
  .nf__bar{background:#FAF7F0; border-bottom:1px solid var(--line); padding:14px 24px}
  .nf__bar img{display:block; height:48px; width:auto}
  .nf__main{flex:1; display:flex; align-items:center; justify-content:center; padding:56px 24px}
  .nf__in{max-width:720px; width:100%; text-align:center}
  .nf__code{
    font-family:'Zen Kaku Gothic New',sans-serif; font-weight:900;
    font-size:clamp(64px,14vw,120px); line-height:1; color:var(--green-l); letter-spacing:.04em;
  }
  .nf__h1{
    margin:10px 0 0; font-family:'Zen Kaku Gothic New',sans-serif; font-weight:900;
    font-size:clamp(21px,3.4vw,30px); line-height:1.45; color:var(--ink);
  }
  .nf__lead{margin:18px auto 0; max-width:560px; font-size:15px; color:var(--muted)}
  .nf__cta{display:flex; flex-wrap:wrap; gap:14px; justify-content:center; margin-top:30px}
  .nf__btn{
    display:inline-flex; align-items:center; justify-content:center;
    border-radius:999px; padding:14px 32px; text-decoration:none;
    font-family:'Zen Kaku Gothic New',sans-serif; font-weight:700; font-size:15px;
    border:2px solid transparent; transition:transform .18s ease, background .18s ease, color .18s ease;
  }
  .nf__btn--p{background:var(--gold); color:#1B2421}
  .nf__btn--p:hover{background:#FFD23F; transform:translateY(-2px)}
  .nf__btn--g{background:transparent; color:var(--green-d); border-color:var(--green)}
  .nf__btn--g:hover{background:var(--green); color:#fff; transform:translateY(-2px)}
  .nf__links{
    margin-top:44px; padding-top:28px; border-top:1px solid var(--line);
    display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:10px;
  }
  .nf__links a{
    display:flex; align-items:center; gap:10px;
    background:#fff; border:1px solid var(--line); border-radius:12px;
    padding:13px 18px; font-size:14px; font-weight:700; color:var(--green-d);
    text-decoration:none; text-align:left; line-height:1.5;
    transition:background .18s ease, color .18s ease, border-color .18s ease;
  }
  .nf__links a::before{content:""; flex:0 0 6px; width:6px; height:6px; border-radius:50%; background:var(--green-l)}
  .nf__links a:hover,.nf__links a:focus-visible{background:var(--green); color:#fff; border-color:var(--green)}
  .nf__links a:hover::before,.nf__links a:focus-visible::before{background:#fff}
  .nf__foot{background:var(--green-d); color:rgba(255,255,255,.9); text-align:center; padding:26px 24px; font-size:14px}
  .nf__foot a{color:var(--gold); text-decoration:none; font-weight:700}
  @media (prefers-reduced-motion:reduce){ .nf__btn,.nf__links a{transition:none} .nf__btn:hover{transform:none} }
</style>
</head>
<body>

<header class="nf__bar">
  <a href="/"><img src="/wp-content/uploads/2025/11/ALTANTOUR-logo.jpg" alt="モンゴル現地旅行社アルタンツアー"></a>
</header>

<main class="nf__main">
  <div class="nf__in">
    <p class="nf__code">404</p>
    <h1 class="nf__h1">お探しのページが見つかりませんでした</h1>
    <p class="nf__lead">URLが変更されたか、ページが削除された可能性があります。下のリンクからお探しください。ご不明な点は日本語でお気軽にお問い合わせください。</p>

    <div class="nf__cta">
      <a class="nf__btn nf__btn--p" href="/tours-list/">モンゴルツアー一覧を見る</a>
      <a class="nf__btn nf__btn--g" href="/contact/">お問い合わせ</a>
    </div>

    <nav class="nf__links" aria-label="主なページ">
      <a href="/">ホーム</a>
      <a href="/tours-list/">ツアー一覧</a>
      <a href="/mongolia-horse-tour/">モンゴル乗馬ツアー</a>
      <a href="/flower-hiking-site/">フラワーハイキング</a>
      <a href="/gobi-tours-6-days/">ゴビ砂漠ツアー</a>
      <a href="/ordermade/">オーダーメイドツアー</a>
      <a href="/guide/">ご利用ガイド</a>
      <a href="/q-and-a/">よくあるご質問</a>
      <a href="/mongolia-info/">モンゴルを知る</a>
      <a href="/company-info/">会社案内</a>
    </nav>
  </div>
</main>

<footer class="nf__foot">
  モンゴル現地旅行社アルタンツアー　／　モンゴル　TEL：<a href="tel:+97685109922">976-8510-9922</a>　／　日本連絡先　TEL：<a href="tel:07091819922">070-9181-9922</a><br>
  <a href="mailto:info@mongoru.jp">メールでお問い合わせ</a>
</footer>

</body>
</html>
