<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1180" width="800" height="1180">
  <rect width="800" height="1180" fill="#E9E9EE"/>
  <rect x="30" y="30" width="740" height="1120" rx="48" fill="#EFE8CB"/>

  <!-- 1/5 -->
  <text x="78" y="118" font-family="Noto Sans CJK JP, sans-serif" font-weight="700" font-size="44" fill="#2B3A67">1</text>
  <line x1="72" y1="170" x2="140" y2="80" stroke="#2B3A67" stroke-width="4"/>
  <text x="118" y="168" font-family="Noto Sans CJK JP, sans-serif" font-weight="700" font-size="30" fill="#2B3A67">5</text>

  <!-- clouds -->
  <g fill="#FFFFFF" opacity="0.9">
    <ellipse cx="560" cy="250" rx="46" ry="18"/><ellipse cx="585" cy="236" rx="28" ry="20"/>
    <ellipse cx="190" cy="300" rx="40" ry="15"/><ellipse cx="210" cy="288" rx="24" ry="17"/>
  </g>

  <!-- plane + trail -->
  <path d="M150 330 C 230 250, 330 200, 395 140" fill="none" stroke="#9DB7D9" stroke-width="5" stroke-dasharray="4 14" stroke-linecap="round"/>
  <g transform="translate(430,115) rotate(-30)">
    <ellipse cx="0" cy="0" rx="48" ry="12" fill="#FFFFFF"/>
    <path d="M-8 -4 L-24 -40 L-10 -40 L18 -4 Z" fill="#D7E4F5"/>
    <path d="M-8 4 L-24 40 L-10 40 L18 4 Z" fill="#D7E4F5"/>
    <path d="M-40 -2 L-52 -22 L-44 -22 L-30 -2 Z" fill="#D7E4F5"/>
    <circle cx="26" cy="-2" r="3" fill="#6C8EBF"/><circle cx="14" cy="-2" r="3" fill="#6C8EBF"/><circle cx="2" cy="-2" r="3" fill="#6C8EBF"/>
  </g>

  <!-- map pin -->
  <g transform="translate(130,560)">
    <path d="M0 0 C -30 -30, -30 -70, 0 -70 C 30 -70, 30 -30, 0 0 Z" fill="#E85D5D"/>
    <circle cx="0" cy="-45" r="11" fill="#EFE8CB"/>
  </g>

  <!-- shadows -->
  <ellipse cx="300" cy="655" rx="90" ry="12" fill="#D9CFA6"/>
  <ellipse cx="560" cy="655" rx="90" ry="12" fill="#D9CFA6"/>

  <!-- ===== Woman ===== -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- legs -->
    <polyline points="282,460 250,540 205,575" stroke="#2B2D42" stroke-width="32"/>
    <polyline points="318,460 345,545 330,610" stroke="#2B2D42" stroke-width="32"/>
    <!-- arms -->
    <polyline points="272,330 220,260 205,190" stroke="#FF6B5B" stroke-width="28"/>
    <polyline points="330,330 385,385 405,420" stroke="#FF6B5B" stroke-width="28"/>
  </g>
  <ellipse cx="195" cy="582" rx="24" ry="11" fill="#FFFFFF" transform="rotate(-20 195 582)"/>
  <ellipse cx="338" cy="622" rx="24" ry="11" fill="#FFFFFF"/>
  <circle cx="203" cy="178" r="15" fill="#E8A37C"/>
  <!-- suitcase -->
  <g transform="rotate(8 440 500)">
    <path d="M420 445 v-16 h40 v16" fill="none" stroke="#5B4A3A" stroke-width="7"/>
    <rect x="395" y="445" width="92" height="120" rx="14" fill="#FFC93C"/>
    <rect x="395" y="490" width="92" height="12" fill="#E8A92A"/>
    <circle cx="410" cy="570" r="7" fill="#5B4A3A"/><circle cx="472" cy="570" r="7" fill="#5B4A3A"/>
  </g>
  <circle cx="408" cy="428" r="15" fill="#E8A37C"/>
  <!-- torso -->
  <path d="M262 315 Q300 300 338 315 L350 470 L250 470 Z" fill="#FF6B5B"/>
  <path d="M250 440 L350 440 L355 478 L245 478 Z" fill="#2B2D42"/>
  <rect x="290" y="285" width="20" height="25" fill="#E8A37C"/>
  <!-- head -->
  <circle cx="300" cy="258" r="38" fill="#E8A37C"/>
  <path d="M262 258 C 258 210, 342 205, 338 255 C 325 235, 290 228, 262 258 Z" fill="#1E1E2A"/>
  <circle cx="300" cy="205" r="22" fill="#1E1E2A"/>
  <circle cx="287" cy="262" r="3.5" fill="#1E1E2A"/><circle cx="313" cy="262" r="3.5" fill="#1E1E2A"/>
  <path d="M288 276 Q300 288 312 276" fill="none" stroke="#1E1E2A" stroke-width="3.5" stroke-linecap="round"/>

  <!-- ===== Man ===== -->
  <!-- the outer arm is lowered from its original reach to y=170: the
       stamp now sits in that corner and would have swallowed the hand -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="540,440 522,520 545,600" stroke="#3D405B" stroke-width="34"/>
    <polyline points="578,440 630,500 685,525" stroke="#3D405B" stroke-width="34"/>
  </g>
  <ellipse cx="553" cy="612" rx="26" ry="11" fill="#2EC4B6"/>
  <ellipse cx="700" cy="530" rx="26" ry="11" fill="#2EC4B6" transform="rotate(20 700 530)"/>
  <!-- backpack -->
  <rect x="595" y="310" width="52" height="105" rx="16" fill="#F4A261"/>
  <rect x="603" y="360" width="36" height="34" rx="8" fill="#E07A3A"/>
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="532,310 480,235 465,160" stroke="#2EC4B6" stroke-width="30"/>
    <polyline points="588,310 628,272 648,240" stroke="#2EC4B6" stroke-width="30"/>
  </g>
  <circle cx="463" cy="148" r="16" fill="#C68B59"/><circle cx="652" cy="232" r="16" fill="#C68B59"/>
  <path d="M520 295 Q560 282 600 295 L606 450 L514 450 Z" fill="#2EC4B6"/>
  <path d="M590 298 L572 450" stroke="#B5651D" stroke-width="7"/>
  <rect x="550" y="262" width="20" height="28" fill="#C68B59"/>
  <circle cx="560" cy="232" r="38" fill="#C68B59"/>
  <path d="M522 230 C 515 180, 600 175, 598 228 L588 214 L575 222 L562 208 L548 220 L534 210 Z" fill="#1E1E2A"/>
  <circle cx="547" cy="238" r="3.5" fill="#1E1E2A"/><circle cx="573" cy="238" r="3.5" fill="#1E1E2A"/>
  <path d="M546 250 Q560 266 574 250 Z" fill="#FFFFFF" stroke="#1E1E2A" stroke-width="3" stroke-linejoin="round"/>

  <!-- 現地旅行社へ直接 stamp: same seal as 3/5's 正規販売代理店, same
       top-right corner. Drawn last so it reads as a stamp on top. -->
  <g transform="translate(664,140) rotate(-8)">
    <circle r="68" fill="#E05A5A"/>
    <circle r="58" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="3 6"/>
    <text x="0" y="-8" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-weight="700" font-size="22" fill="#FFFFFF">現地旅行社</text>
    <text x="0" y="26" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-weight="700" font-size="26" fill="#FFFFFF">へ直接</text>
  </g>

  <!-- text: title baseline 800, body 28px from 870 at 44 leading, no line
       over 18 characters so nothing reaches the panel edge. Same grid and
       same measure on all three cards. -->
  <text x="78" y="800" font-family="Noto Sans CJK JP, sans-serif" font-weight="700" font-size="44" fill="#1E1E2A">さあ、旅に出かけよう！</text>
  <text font-family="Noto Sans CJK JP, sans-serif" font-size="28" fill="#3A3A3A">
    <tspan x="78" y="870">行きたい場所へ、行きたい日に。</tspan>
    <tspan x="78" y="914">お客様のご予定に合わせて、</tspan>
    <tspan x="78" y="958">楽しい旅をご用意いたします。</tspan>
  </text>
</svg>
