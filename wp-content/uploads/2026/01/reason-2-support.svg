<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1180" width="800" height="1180">
  <rect width="800" height="1180" fill="#E9E9EE"/>
  <rect x="30" y="30" width="740" height="1120" rx="48" fill="#EFE8CB"/>

  <!-- 2/5 -->
  <text x="78" y="118" font-family="Noto Sans CJK JP, sans-serif" font-weight="700" font-size="44" fill="#2B3A67">2</text>
  <line x1="72" y1="170" x2="140" y2="80" stroke="#2B3A67" stroke-width="4"/>
  <text x="118" y="168" font-family="Noto Sans CJK JP, sans-serif" font-weight="700" font-size="30" fill="#2B3A67">5</text>

  <!-- 25 years badge, scaled up a step from the original 66px radius -->
  <g transform="translate(648,160) scale(1.18)">
    <path d="M-30 50 L-42 105 L-18 92 L-8 115 L4 58 Z" fill="#E85D5D"/>
    <path d="M30 50 L42 105 L18 92 L8 115 L-4 58 Z" fill="#C94848"/>
    <circle r="66" fill="#FFB547"/>
    <circle r="54" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="3 6"/>
    <text x="0" y="10" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-weight="900" font-size="46" fill="#FFFFFF">25</text>
    <text x="0" y="38" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-weight="700" font-size="17" fill="#FFFFFF">年の実績</text>
  </g>

  <!-- clouds -->
  <g fill="#FFFFFF" opacity="0.9">
    <ellipse cx="250" cy="150" rx="44" ry="16"/><ellipse cx="272" cy="137" rx="26" ry="18"/>
    <ellipse cx="520" cy="215" rx="38" ry="14"/><ellipse cx="538" cy="204" rx="22" ry="15"/>
  </g>

  <!-- ===== HQ (Mongolia) ===== -->
  <g>
    <rect x="125" y="330" width="110" height="240" fill="#6C8EBF"/>
    <rect x="125" y="330" width="110" height="14" fill="#55739E"/>
    <g fill="#DCE8F7">
      <rect x="140" y="360" width="22" height="26"/><rect x="170" y="360" width="22" height="26"/><rect x="200" y="360" width="22" height="26"/>
      <rect x="140" y="400" width="22" height="26"/><rect x="170" y="400" width="22" height="26"/><rect x="200" y="400" width="22" height="26"/>
      <rect x="140" y="440" width="22" height="26"/><rect x="170" y="440" width="22" height="26"/><rect x="200" y="440" width="22" height="26"/>
      <rect x="140" y="480" width="22" height="26"/><rect x="170" y="480" width="22" height="26"/><rect x="200" y="480" width="22" height="26"/>
    </g>
    <!-- flag on roof (Mongolia colors) -->
    <line x1="140" y1="330" x2="140" y2="288" stroke="#5B4A3A" stroke-width="4"/>
    <rect x="142" y="290" width="11" height="22" fill="#C4272F"/>
    <rect x="153" y="290" width="11" height="22" fill="#015197"/>
    <rect x="164" y="290" width="11" height="22" fill="#C4272F"/>
    <!-- ger -->
    <path d="M60 570 L60 520 Q105 470 150 520 L150 570 Z" fill="#FFFFFF"/>
    <path d="M60 520 Q105 470 150 520" fill="none" stroke="#E85D5D" stroke-width="6"/>
    <rect x="60" y="535" width="90" height="7" fill="#E85D5D"/>
    <rect x="94" y="545" width="22" height="25" fill="#E85D5D"/>
    <!-- sign -->
    <rect x="140" y="528" width="80" height="34" rx="8" fill="#2B3A67"/>
    <text x="180" y="553" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-weight="700" font-size="20" fill="#FFFFFF">本社</text>
  </g>

  <!-- ===== Tokyo branch ===== -->
  <g>
    <!-- tower -->
    <path d="M715 570 L735 390 L755 570" fill="none" stroke="#E85D5D" stroke-width="6" stroke-linejoin="round"/>
    <line x1="735" y1="390" x2="735" y2="350" stroke="#E85D5D" stroke-width="4"/>
    <line x1="722" y1="480" x2="748" y2="480" stroke="#E85D5D" stroke-width="5"/>
    <line x1="718" y1="530" x2="752" y2="530" stroke="#E85D5D" stroke-width="5"/>
    <!-- building -->
    <rect x="565" y="360" width="125" height="210" fill="#2EC4B6"/>
    <rect x="565" y="360" width="125" height="14" fill="#23A398"/>
    <g fill="#E3FAF7">
      <rect x="580" y="390" width="95" height="16"/><rect x="580" y="420" width="95" height="16"/>
      <rect x="580" y="450" width="95" height="16"/><rect x="580" y="480" width="95" height="16"/>
    </g>
    <rect x="570" y="522" width="115" height="34" rx="8" fill="#2B3A67"/>
    <text x="627" y="547" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-weight="700" font-size="20" fill="#FFFFFF">東京支社</text>
  </g>

  <!-- connection arc + plane -->
  <path d="M195 270 Q410 110 625 345" fill="none" stroke="#9DB7D9" stroke-width="5" stroke-dasharray="4 14" stroke-linecap="round"/>
  <g transform="translate(410,195) rotate(8)">
    <ellipse cx="0" cy="0" rx="46" ry="12" fill="#FFFFFF"/>
    <path d="M-8 -4 L-24 -38 L-10 -38 L18 -4 Z" fill="#D7E4F5"/>
    <path d="M-8 4 L-24 38 L-10 38 L18 4 Z" fill="#D7E4F5"/>
    <path d="M-38 -2 L-50 -20 L-42 -20 L-28 -2 Z" fill="#D7E4F5"/>
    <circle cx="24" cy="-2" r="3" fill="#6C8EBF"/><circle cx="12" cy="-2" r="3" fill="#6C8EBF"/><circle cx="0" cy="-2" r="3" fill="#6C8EBF"/>
  </g>

  <!-- shadows -->
  <ellipse cx="330" cy="660" rx="70" ry="11" fill="#D9CFA6"/>
  <ellipse cx="480" cy="660" rx="70" ry="11" fill="#D9CFA6"/>

  <!-- speech bubble -->
  <g transform="translate(0,-30)">
    <path d="M190 228 h120 a16 16 0 0 1 16 16 v34 a16 16 0 0 1 -16 16 h-62 l-20 22 l2 -22 h-40 a16 16 0 0 1 -16 -16 v-34 a16 16 0 0 1 16 -16 z" fill="#FFFFFF"/>
    <text x="250" y="270" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-weight="700" font-size="22" fill="#E85D5D">日本語OK!</text>
  </g>

  <!-- ===== Staff woman (headset) ===== -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="315" y1="540" x2="312" y2="645" stroke="#2B2D42" stroke-width="26"/>
    <line x1="345" y1="540" x2="350" y2="645" stroke="#2B2D42" stroke-width="26"/>
    <polyline points="305,440 270,395 262,345" stroke="#FF6B5B" stroke-width="24"/>
    <polyline points="358,440 380,500 360,535" stroke="#FF6B5B" stroke-width="24"/>
  </g>
  <ellipse cx="305" cy="650" rx="20" ry="9" fill="#FFFFFF"/>
  <ellipse cx="357" cy="650" rx="20" ry="9" fill="#FFFFFF"/>
  <circle cx="261" cy="335" r="13" fill="#E8A37C"/>
  <circle cx="358" cy="538" r="13" fill="#E8A37C"/>
  <path d="M296 428 Q330 416 364 428 L376 560 L284 560 Z" fill="#FF6B5B"/>
  <rect x="322" y="398" width="18" height="24" fill="#E8A37C"/>
  <circle cx="330" cy="370" r="35" fill="#E8A37C"/>
  <path d="M292 385 C 282 320, 378 320, 368 385 L360 385 C 360 350, 330 345, 312 352 C 302 360, 300 375, 300 385 Z" fill="#1E1E2A"/>
  <!-- headset -->
  <path d="M294 372 C 290 322, 370 322, 366 372" fill="none" stroke="#2B3A67" stroke-width="6"/>
  <rect x="286" y="362" width="14" height="24" rx="6" fill="#2B3A67"/>
  <path d="M293 384 Q300 405 322 402" fill="none" stroke="#2B3A67" stroke-width="4" stroke-linecap="round"/>
  <circle cx="324" cy="402" r="5" fill="#2B3A67"/>
  <circle cx="320" cy="372" r="3.5" fill="#1E1E2A"/><circle cx="344" cy="372" r="3.5" fill="#1E1E2A"/>
  <path d="M322 386 Q333 396 344 386" fill="none" stroke="#1E1E2A" stroke-width="3.5" stroke-linecap="round"/>

  <!-- ===== Guide man (flag) ===== -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="466" y1="530" x2="462" y2="645" stroke="#3D405B" stroke-width="28"/>
    <line x1="496" y1="530" x2="502" y2="645" stroke="#3D405B" stroke-width="28"/>
    <polyline points="452,430 432,490 440,530" stroke="#FFFFFF" stroke-width="26"/>
    <polyline points="510,430 545,385 552,335" stroke="#FFFFFF" stroke-width="26"/>
  </g>
  <ellipse cx="455" cy="650" rx="21" ry="9" fill="#2EC4B6"/>
  <ellipse cx="509" cy="650" rx="21" ry="9" fill="#2EC4B6"/>
  <!-- flag -->
  <line x1="553" y1="350" x2="553" y2="230" stroke="#5B4A3A" stroke-width="5" stroke-linecap="round"/>
  <path d="M556 232 L625 252 L556 274 Z" fill="#FFC93C"/>
  <circle cx="553" cy="335" r="14" fill="#C68B59"/>
  <circle cx="441" cy="535" r="14" fill="#C68B59"/>
  <!-- torso: shirt + vest -->
  <path d="M444 420 Q481 407 518 420 L524 545 L438 545 Z" fill="#FFFFFF"/>
  <path d="M444 420 L468 418 L470 545 L438 545 Z" fill="#F4A261"/>
  <path d="M518 420 L494 418 L492 545 L524 545 Z" fill="#F4A261"/>
  <rect x="472" y="390" width="18" height="26" fill="#C68B59"/>
  <circle cx="481" cy="362" r="35" fill="#C68B59"/>
  <!-- cap -->
  <path d="M446 352 C 446 315, 516 315, 516 352 Z" fill="#2B3A67"/>
  <path d="M500 350 L535 352 L516 342 Z" fill="#2B3A67"/>
  <circle cx="469" cy="366" r="3.5" fill="#1E1E2A"/><circle cx="493" cy="366" r="3.5" fill="#1E1E2A"/>
  <path d="M468 378 Q481 392 494 378 Z" fill="#FFFFFF" stroke="#1E1E2A" stroke-width="3" stroke-linejoin="round"/>

  <!-- text: title baseline 800, body from 70 below the last title line at
       46 leading - the same grid on all three cards. The body was five
       short lines ending 66px off the card edge; set to the panel's full
       measure it runs four and breaks on phrase boundaries. -->
  <text font-family="Noto Sans CJK JP, sans-serif" font-weight="700" font-size="44" fill="#1E1E2A">
    <tspan x="78" y="800">本社と東京支社が</tspan>
    <tspan x="78" y="856">旅をサポートします</tspan>
  </text>
  <text font-family="Noto Sans CJK JP, sans-serif" font-size="28" fill="#3A3A3A">
    <tspan x="78" y="926">お問合せは日本語堪能なモンゴル人</tspan>
    <tspan x="78" y="970">スタッフが対応。25年の経験と信頼。</tspan>
    <tspan x="78" y="1014">現地ツアーに日本語ガイドが付くので、</tspan>
    <tspan x="78" y="1058">ご安心。東京支社が皆様の旅を</tspan>
    <tspan x="78" y="1102">サポートします。</tspan>
  </text>
</svg>
