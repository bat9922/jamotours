    <path d="M70 625 Q300 590 520 620 Q640 605 730 615 V650 H70 Z" fill="#2F5A40"/>
    <!-- ger -->
    <path d="M470 610 V560 Q545 495 620 560 V610 Z" fill="#FFFFFF"/>
    <path d="M470 560 Q545 495 620 560" fill="none" stroke="#E85D5D" stroke-width="6"/>
    <rect x="470" y="572" width="150" height="8" fill="#E85D5D"/>
    <rect x="530" y="580" width="30" height="30" fill="#FFB547"/>
    <rect x="538" y="518" width="14" height="10" fill="#9DB7D9"/>
    <line x1="545" y1="518" x2="545" y2="500" stroke="#8A8A8A" stroke-width="4"/>
