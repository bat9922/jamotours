      <circle cx="470" cy="240" r="3"/><circle cx="520" cy="330" r="2"/><circle cx="560" cy="270" r="2.5"/>
      <circle cx="140" cy="380" r="2"/><circle cx="400" cy="380" r="2.5"/><circle cx="600" cy="390" r="2"/>
      <circle cx="680" cy="340" r="2"/><circle cx="210" cy="360" r="1.8"/><circle cx="460" cy="420" r="1.8"/>
    </g>
    <g fill="#FFD66B">
