  <path d="M180 470 Q140 545 180 620" fill="none" stroke="#C47A3A" stroke-width="6" stroke-linecap="round"/>
  <line x1="180" y1="470" x2="180" y2="620" stroke="#EFE8CB" stroke-width="1.5"/>
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="218,478 192,520 178,545" stroke="#3A86FF" stroke-width="20"/>
    <polyline points="266,478 290,520 305,545" stroke="#3A86FF" stroke-width="20"/>
  </g>
  <circle cx="176" cy="548" r="10" fill="#E8A37C"/>
  <path d="M212 470 Q242 460 272 470 L285 610 L200 610 Z" fill="#3A86FF"/>
  <path d="M242 466 L262 500" stroke="#FFC93C" stroke-width="5"/>
  <rect x="204" y="530" width="76" height="12" fill="#FFC93C"/>
  <rect x="215" y="608" width="22" height="16" rx="4" fill="#5B4A3A"/>
  <rect x="248" y="608" width="22" height="16" rx="4" fill="#5B4A3A"/>
  <rect x="234" y="445" width="16" height="20" fill="#E8A37C"/>
  <circle cx="242" cy="428" r="28" fill="#E8A37C"/>
  <!-- hat -->
  <path d="M212 418 Q242 370 272 418 Z" fill="#E85D5D"/>
  <rect x="208" y="412" width="68" height="10" rx="5" fill="#FFC93C"/>
  <circle cx="242" cy="378" r="5" fill="#FFC93C"/>
  <circle cx="232" cy="433" r="3" fill="#1E1E2A"/><circle cx="252" cy="433" r="3" fill="#1E1E2A"/>
  <path d="M233 444 Q242 452 251 444" fill="none" stroke="#1E1E2A" stroke-width="3" stroke-linecap="round"/>

  <!-- ===== Child in deel pointing at stars ===== -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="344,522 366,488 380,452" stroke="#E85D5D" stroke-width="16"/>
    <polyline points="312,522 300,555 304,575" stroke="#E85D5D" stroke-width="16"/>
  </g>
  <circle cx="382" cy="446" r="8" fill="#C68B59"/>
  <circle cx="305" cy="578" r="8" fill="#C68B59"/>
  <path d="M308 515 Q328 507 348 515 L358 612 L298 612 Z" fill="#E85D5D"/>
  <rect x="301" y="555" width="54" height="9" fill="#2EC4B6"/>
  <rect x="308" y="610" width="17" height="13" rx="4" fill="#5B4A3A"/>
  <rect x="332" y="610" width="17" height="13" rx="4" fill="#5B4A3A"/>
  <circle cx="328" cy="490" r="22" fill="#C68B59"/>
  <path d="M306 488 C 304 460, 352 460, 350 488 C 340 476, 318 474, 306 488 Z" fill="#1E1E2A"/>
  <circle cx="322" cy="492" r="2.5" fill="#1E1E2A"/><circle cx="338" cy="492" r="2.5" fill="#1E1E2A"/>
  <path d="M322 500 Q330 510 338 500 Z" fill="#FFFFFF" stroke="#1E1E2A" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- 50% OFF badge -->
  <g transform="translate(655,175) rotate(8)">
    <path d="M0 -78 L18 -62 L42 -66 L48 -42 L70 -32 L62 -10 L76 10 L58 26 L60 50 L36 54 L24 76 L2 66 L-20 78 L-34 58 L-58 56 L-58 32 L-76 16 L-62 -4 L-70 -28 L-48 -38 L-44 -62 L-20 -60 Z" fill="#FF6B5B"/>
