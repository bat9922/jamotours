    <circle cx="420" cy="270" r="4" fill="#FFFFFF"/>
    <!-- moon -->
    <circle cx="640" cy="270" r="34" fill="#FFD66B"/>
    <circle cx="656" cy="258" r="30" fill="#2B3A67"/>
    <!-- hills -->
