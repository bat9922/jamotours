    <text x="0" y="16" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-weight="900" font-size="42" fill="#FFFFFF">50%</text>
    <text x="0" y="44" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-weight="900" font-size="22" fill="#FFF3B0">OFF</text>
  </g>

  <!-- text: title baseline 800, body from 870 at 46 leading - the same
       grid on all three cards so the blocks line up across the slider -->
  <text x="78" y="800" font-family="Noto Sans CJK JP, sans-serif" font-weight="700" font-size="44" fill="#1E1E2A">割引・特典＆取消料無料</text>
  <text font-family="Noto Sans CJK JP, sans-serif" font-size="28" fill="#3A3A3A">
    <tspan x="78" y="870">お子様（12歳以下）は<tspan font-weight="700" fill="#E85D5D">最大50％OFF！</tspan></tspan>
    <tspan x="78" y="914">ゲル泊なら星空観察・民族衣装の試着・</tspan>
    <tspan x="78" y="958">弓矢体験などの各体験が無料！</tspan>
  </text>
  <g>
    <rect x="78" y="1000" width="440" height="54" rx="27" fill="#2B3A67"/>
    <text x="298" y="1036" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-weight="700" font-size="26" fill="#FFFFFF">更にご家族はキャンセル料無料！</text>
  </g>
</svg>
